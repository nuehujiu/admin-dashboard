name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: backend-check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 后端语法检查
        run: |
          set -e
          node --check backend/app.js
          for f in backend/controllers/*.js backend/routes/*.js backend/middleware/*.js backend/utils/*.js backend/config/*.js; do
            echo "check $f"; node --check "$f"
          done

      - name: 校验 OpenAPI 是合法 JSON
        run: |
          python3 - <<'PY'
          import json
          doc = json.load(open('研发流程/api-openapi.json', encoding='utf-8'))
          paths = doc.get('paths', {})
          methods = sum(len(v) for v in paths.values())
          print(f'openapi ok: {len(paths)} paths / {methods} methods')
          PY

      - name: 拦截误提交的敏感文件与依赖
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)node_modules/|(^|/)dist/' || true)
          if [ -n "$bad" ]; then
            echo "禁止提交以下文件："
            echo "$bad"
            exit 1
          fi
          echo "无敏感文件、无 node_modules/dist"

  frontend:
    name: frontend-lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm exec eslint .

      - name: 构建（验证可打包，不产出部署产物）
        run: pnpm build
