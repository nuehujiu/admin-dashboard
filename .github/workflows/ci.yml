name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 后端与 Mock 语法检查
        run: |
          set -e
          node --check mock/mock-server.js
          node --check backend/app.js
          for f in backend/controllers/*.js backend/routes/*.js backend/middleware/*.js backend/utils/*.js backend/config/*.js; do
            echo "check $f"; node --check "$f"
          done

      - name: 校验 OpenAPI 是合法 JSON
        run: |
          python3 - <<'PY'
          import json
          doc = json.load(open('研发流程/api-openapi.json', encoding='utf-8'))
          paths = doc.get('paths', {})
          methods = sum(len(v) for v in paths.values())
          print(f'openapi ok: {len(paths)} paths / {methods} methods')
          PY

      - name: 拦截误提交的敏感文件与依赖
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)node_modules/|(^|/)dist/' || true)
          if [ -n "$bad" ]; then
            echo "禁止提交以下文件："
            echo "$bad"
            exit 1
          fi
          echo "无敏感文件、无 node_modules/dist"

      # 说明：前端当前依赖未补齐（antd/axios/zustand/echarts/react-router-dom），
      # 此处不跑 npm run build，避免 PR 恒红。依赖补全后再打开下面这段。
      #
      # - name: 前端构建
      #   run: |
      #     cd frontend
      #     npm ci || npm install
      #     npm run build
